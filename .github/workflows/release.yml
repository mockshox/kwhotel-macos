name: Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "gui/**"
      - "setup.sh"
      - "uninstall.sh"
      - "lib/**"
      - "assets/**"
      - "KWHotel.app/Contents/Info.plist"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        env:
          KWHOTEL_REQUIRE_UNIVERSAL: "1"
        run: ./gui/build.sh

      - name: Check the package
        run: |
          set -euo pipefail
          lipo -info "KWHotel.app/Contents/MacOS/KWHotel" | grep -q "arm64"
          lipo -info "KWHotel.app/Contents/MacOS/KWHotel" | grep -q "x86_64"
          test -s dist/KWHotel-for-MacOS.zip
          unzip -l dist/KWHotel-for-MacOS.zip | grep -q "KWHotel for MacOS.app/"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(plutil -extract CFBundleShortVersionString raw "KWHotel.app/Contents/Info.plist")"
          short="${GITHUB_SHA::7}"
          tag="v${version}-${short}"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Built from commit ${GITHUB_SHA}.

          macOS says it could not verify the app. Click Done. The blue button moves it to the Bin.

          Open System Settings and go to Privacy & Security. A row appears saying KWHotel for MacOS was blocked. Click Open Anyway.

          macOS asks once more. Click Open. If it asks for a password, enter the password for this Mac.
          EOF
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "dist/KWHotel-for-MacOS.zip" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "dist/KWHotel-for-MacOS.zip" \
              --repo "$GITHUB_REPOSITORY" \
              --title "KWHotel for MacOS ${version} (${short})" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --latest
          fi
